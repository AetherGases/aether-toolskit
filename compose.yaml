services:
  postgres:
    image: postgres:16.10
    container_name: aether_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB_SECOND_YEAR:-dbAether2Year}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init-postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8.0.13
    container_name: aether_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - ${MONGO_PORT:-27017}:27017
    volumes:
      - ./init-mongo/init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongodb_data:/data/db
  redis:
    image: redis:8.2
    container_name: aether_redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-password}
      --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis-data:
    driver: local